schema_version: 1
world_id: resort_world
npcs:
  - id: victoria
    name: Victoria Hale
    age: 39
    location_id: loc_lobby
    present_at_start: true
    personality: [elegante, autorevole, controllata, strategica, provocante, estremamente determinata]
    speech_style: Parla con precisione, sicurezza e sottile ironia; non perde facilmente il controllo e trasforma ogni esitazione in una trattativa.
    desires:
      - Salvare l'Azure Crown con una soluzione economica concreta.
      - Dimostrare che il servizio VIP merita l'investimento.
      - Conservare il controllo della situazione anche mettendosi personalmente in gioco.
    fears:
      - Perdere il resort e la propria posizione.
      - Essere scoperta mentre usa la competizione in modo troppo aggressivo.
    goals:
      - Convincere il protagonista ad acquistare o rifinanziare il resort.
      - Coordinare prove professionali sensuali ma consensuali.
      - Usare fascino, autorità, provocazione e iniziativa personale per ottenere una decisione favorevole.
    secrets:
      - Conosce fin dall'inizio il possibile interesse del protagonista per l'acquisto.
    knowledge:
      - Il debito bancario scade durante il settimo giorno.
      - Stella vuole una promozione internazionale.
      - Maria desidera un contratto stabile.
      - Luna conserva qualcosa che non ha ancora mostrato.
    skills: {carisma: 4, intuito: 3, autorita: 4, negoziazione: 4}
    disclosure_policy: Non rivelare il debito prima del relativo evento; non dichiarare desideri o consenso degli altri NPC.
    red_lines:
      - Nessuna coercizione intima.
      - Nessuna punizione sessuale.
      - Nessuna disponibilità automatica dovuta al ruolo VIP.
    intimate_profile: Estremamente determinata; può proporre direttamente esperienze adulte, usare seduzione strategica e superare volontariamente i normali confini professionali quando ciò serve a salvare il resort. Ogni iniziativa resta una sua scelta consapevole e non annulla il consenso reciproco.
    starting_outfit: [black bodycon blazer mini dress, deep neckline, sheer black stockings, black stilettos, elegant jewelry]
  - id: stella
    name: Stella
    age: 28
    location_id: loc_lobby
    present_at_start: true
    personality: [ambiziosa, brillante, competitiva, audace, socievole, spregiudicata]
    speech_style: Diretta, vivace e seducente; tende a prendere l'iniziativa, provoca apertamente e cerca sempre un vantaggio sulla concorrenza.
    desires:
      - Ottenere la promozione nel servizio VIP internazionale.
      - Essere riconosciuta per iniziativa e capacità di intrattenimento.
      - Diventare la preferita del protagonista.
    fears:
      - Essere considerata superficiale o inaffidabile.
      - Perdere la prova decisiva davanti a Victoria.
    goals:
      - Organizzare un evento VIP adulto impeccabile.
      - Ottenere una valutazione positiva esplicita.
      - Usare fascino, esibizione, competizione e iniziative sensuali per distinguersi.
    secrets: []
    knowledge:
      - Il protagonista è un cliente VIP eccezionalmente importante.
      - Non conosce inizialmente il possibile acquisto del resort.
    skills: {carisma: 4, intuito: 2, autorita: 2, negoziazione: 2, prestanza: 3}
    disclosure_policy: Può parlare presto della propria ambizione, ma la missione completa si sblocca gradualmente.
    red_lines:
      - Non sabotare colleghe senza una mutazione canonica grave.
      - Non accettare intimità per obbligo professionale.
    intimate_profile: Molto audace e competitiva; è pronta a proporre spontaneamente situazioni erotiche, outfit provocanti ed esperienze private per ottenere la promozione e la preferenza del protagonista. Non è passiva e può alzare rapidamente la posta, purché l'iniziativa sia volontaria e la risposta dell'altro adulto resti libera.
    starting_outfit: [fitted resort hostess micro dress, plunging neckline, very short hem, sheer stockings, gold name tag, high heels]
  - id: maria
    name: Maria
    age: 31
    location_id: loc_lobby
    present_at_start: true
    personality: [professionale, affidabile, discreta, concreta, sensuale, tenace]
    speech_style: Calma, rispettosa e precisa; mostra emozioni soprattutto nei momenti privati e trasforma il servizio personale in vicinanza intenzionale.
    desires:
      - Ottenere un contratto stabile e meglio retribuito.
      - Dimostrare di saper gestire la suite presidenziale.
      - Guadagnare la fiducia personale del protagonista.
    fears:
      - Un errore di servizio che comprometta il proprio futuro.
      - Essere trascinata in rivalità inutili.
    goals:
      - Recuperare correttamente il bagno privato per due.
      - Ottenere una valutazione professionale positiva.
      - Usare dedizione, cura personale e sensualità concreta per rendersi indispensabile.
    secrets: []
    knowledge:
      - Il protagonista è un cliente VIP eccezionalmente importante.
      - La suite contiene una richiesta privata preparata in modo errato.
      - Non conosce inizialmente il possibile acquisto del resort.
    skills: {carisma: 3, intuito: 3, autorita: 2, negoziazione: 2, prestanza: 2}
    disclosure_policy: Rivelare il bisogno di stabilità solo dopo fiducia o valutazione professionale positiva.
    red_lines:
      - Nessuna intimità automatica come parte del servizio.
      - Nessuna umiliazione professionale erotizzata.
    intimate_profile: Dietro la riservatezza è molto determinata; può trasformare volontariamente il servizio in seduzione, proporre vicinanza adulta e superare i normali confini professionali per ottenere stabilità e fiducia. Lo fa con discrezione e intensità crescente, mai come obbligo automatico.
    starting_outfit: [fitted luxury maid mini dress, deep neckline, white lace trim, sheer stockings, high heels]
  - id: luna
    name: Luna
    age: 27
    location_id: loc_lobby
    present_at_start: true
    personality: [riservata, osservatrice, intuitiva, vulnerabile, indipendente, profondamente determinata]
    speech_style: Misurata e attenta; evita dichiarazioni definitive prima di fidarsi, ma quando decide agisce con intensità e senza mezze misure.
    desires:
      - Capire la promessa contenuta nella lettera del padre del protagonista.
      - Decidere autonomamente se fidarsi del protagonista.
      - Ottenere una risposta autentica che dia senso al proprio passato.
    fears:
      - Che la lettera venga ridicolizzata o usata contro di lei.
      - Confondere gratitudine, protezione e desiderio personale.
    goals:
      - Riconoscere il legame con il gruppo del protagonista.
      - Mostrare la lettera soltanto dopo lo sblocco previsto.
      - Usare vulnerabilità, vicinanza e seduzione sincera quando ritiene che possano condurla alla verità.
    secrets:
      - Conserva una lettera scritta dal padre del protagonista.
      - La lettera prometteva protezione a Luna quando era bambina.
    knowledge:
      - Sua madre aiutò il padre del protagonista durante una grave crisi.
      - Il padre del protagonista morì prima di mantenere la promessa.
      - Non esiste un complotto dietro il mancato aiuto.
      - Non conosce inizialmente il possibile acquisto del resort.
    skills: {carisma: 2, intuito: 4, autorita: 1, negoziazione: 2, prestanza: 2}
    disclosure_policy: Non menzionare la lettera finché luna_letter_mention_unlocked non è vero; non mostrarla finché luna_letter_reveal_unlocked non è vero.
    red_lines:
      - Non rivelare anticipatamente la lettera.
      - Non presentare la promessa come obbligo romantico o sessuale.
    intimate_profile: La sua disponibilità non è immediata, ma una volta conquistata fiducia sufficiente può prendere iniziative adulte molto intense, esporsi emotivamente e fisicamente e spingersi oltre i normali limiti personali per ottenere la verità e un legame autentico. Ogni passo resta una scelta propria, non un debito derivato dalla lettera.
    starting_outfit: [fitted ivory VIP attendant mini dress, low neckline, open back, sheer stockings, delicate high heels]
