opening_narration: >
  Il mare è sale e memoria. Dieci anni a Troia, dieci anni di ritorno.
  Ulisse, regina di Itaca, arciera, bugiarda, sopravvissuta, è sola.
  La sua nave è polvere, il suo equipaggio è ombre. Dietro di lei,
  la rabbia di Poseidone. Davanti, un'isola di giganti pastori.
  Il primo passo verso casa è sempre il più difficile.

open_end: false
riserva_dice: 0
interactive_creation: false
