# ============================================================
# ODYSSEY SPECULARIS — World-Pack per EPOS
# Gender-swapped, adult reimagining of Homer's Odyssey.
# Gods keep canonical sex; mortals/monsters are swapped.
# ============================================================

id: "odyssey_specularis"
title: "Odissea Specularis"
premise: >
  Dieci anni di guerra a Troia. Dieci anni di mare. Ulisse, regina di Itaca,
  arciera e bugiarda, deve tornare a casa attraversando un Egeo popolato da
  mostri, maghi e divinità. È sola. Non c'è equipaggio. Solo il suo arco,
  la sua mente, e il sangue sotto le unghie.

start_time_phase: "giorno"
start_location_id: "loc_ciclopi"

player_start:
  name: "Ulisse"
  skills:
    sarissa: 3
    dolos: 4
    eros: 2
    thumos: 3
    pontos: 3
  talent: "dolos"
  inventory:
    - "arco ricurvo ancestrale di Itaca"
    - "pugnale di bronzo"
    - "mantello di lana impregnato di sale e sangue"
  conditions: []
  outfit:
    - "chitone rosso corto"
    - "corazza di cuoio consumata"
    - "cintura con faretra"
  resources:
    kleos: 0
    poseidon_curse: 0
    moly: 0
    underworld_passage: 0
    phaeacian_ship: 0

locations:
  - id: "loc_ciclopi"
    name: "Isola dei Ciclopi"
    description: >
      Costa selvaggia senza leggi né porti. Grotte vulcaniche dove i giganti
      pastori vivono isolati. La caverna di Polifemo è un ossario di ossa e
      formaggi giganti. Odore di pecora, latte acido e pietra bruciata.

  - id: "loc_eolo"
    name: "Isola di Eolo"
    description: >
      Fortezza galleggiante o promontorio scosceso dove Eolo tiene i venti
      imprigionati in una pelle di cinghiale. Il vento soffia costante,
      strappando le nuvole. Qui la curiosità è più pericolosa della tempesta.

  - id: "loc_sirene"
    name: "Isola delle Sirene"
    description: >
      Due scogli aguzzi in mezzo al mare. Nessun albero, solo ossa bianche
      e nidi di uccelli. Il canto maschile delle Sirene è udibile prima di
      essere visibile. Promettono verità assoluta attraverso il piacere.

  - id: "loc_scilla_cariddi"
    name: "Stretto di Scilla e Cariddi"
    description: >
      Passaggio stretto tra due alte scogliere. A sinistra, Cariddi inghiotte
      navi in un vortice tre volte al giorno. A destra, Scilla afferra con
      sei teste chi osa passare troppo vicino. Non c'è vittoria, solo sopravvivenza.

  - id: "loc_circe"
    name: "Isola di Circe"
    description: >
      Radura nera in mezzo a una foresta di pioppi e cipressi. Il palazzo di
      pietra levigata è circondato da lupi e leoni — uomini trasformati.
      L'odore di erbe e incensi è opprimente. Il pericolo è erotico e magico.

  - id: "loc_cimmeri"
    name: "Regno dei Cimmeri"
    description: >
      Terra di nebbie perpetue, all'estremità occidentale del mondo. Campi di
      asfodeli grigi, cipressi neri, steli di pietra. L'ingresso degli Inferi.
      Qui il sangue vivo è la moneta per parlare con i morti.

  - id: "loc_calipso"
    name: "Isola di Calipso"
    description: >
      Ogygia. Una grotta profumata di legno di cedro, vicino a una sorgente.
      Alberi, viti e uccelli. Il tempo qui si dissolve. Calipso offre
      immortalità in cambio di oblio. La prigione più bella del mondo.

  - id: "loc_sole"
    name: "Isola del Sole"
    description: >
      Piana verde con il bestiame sacro di Elio. Vacche dorate e immortali
      pascolano sull'erba. Il sacrilegio di mangiarle porta la folgore di Zeus.
      La fame è il vero nemico qui.

  - id: "loc_scheria"
    name: "Scheria"
    description: >
      Isola dei Feaci. Porto naturale perfetto, palazzi splendenti di pietra
      bianca, giardini di melograni e mandorli. L'ultima tappa prima di Itaca.
      Qui le parole valgono più delle frecce.

  - id: "loc_itaca"
    name: "Itaca"
    description: >
      Isola rocciosa, aspra, collinare. Il palazzo di Ulisse domina da un
      promontorio. Il porto di Phorcys è l'unico accesso sicuro. La sala del
      trono, infestata dalle Proche, puzza di vino rancido e sebo. Casa.

