    summary: "Fuggire dalla caverna di Polifemo accecandola o ingannandola."
    concludes_slice: false

  - id: "marker_eolo"
    summary: "Resistere alla curiosità di aprire la pelle di cinghiale."
    concludes_slice: false

  - id: "marker_sirene"
    summary: "Sopravvivere al canto maschile senza impazzire o annegare."
    concludes_slice: false

  - id: "marker_scilla_cariddi"
    summary: "Attraversare lo stretto sacrificando sangue ma non la vita."
    concludes_slice: false

  - id: "marker_circe"
    summary: "Ottenere il rituale per l'Ade da Circe senza trasformarsi in bestia."
    concludes_slice: false

  - id: "marker_cimmeri"
    summary: "Versare il sangue e resistere alle ombre affamate per parlare con Tiresia."
    concludes_slice: false

  - id: "marker_calipso"
    summary: "Ricordare Itaca dopo sette anni di piacere e oblio."
    concludes_slice: false

  - id: "marker_sole"
    summary: "Resistere alla fame senza commettere sacrilegio sul bestiame d'oro."
    concludes_slice: false

  - id: "marker_scheria"
    summary: "Commuovere la corte dei Feaci e ottenere il passaggio verso Itaca."
    concludes_slice: false

  - id: "marker_itaca"
    summary: "Il massacro finale: travestimento, arco, riconoscimento."
    concludes_slice: true

pressures:
  - id: "press_poseidone"
    summary: "La maledizione di Poseidone incombe su ogni viaggio per mare."
    escalation_hint: "Tempeste più violente, Pontos ridotto, possibile naufragio."

  - id: "press_proche"
    summary: "Le Proche occupano il palazzo di Itaca, divorandone le risorse."
    escalation_hint: "Penelope sempre più a rischio, il traco minacciato, la violenza imminente."

  - id: "press_fame"
    summary: "La fame è compagna costante del viaggio solitario."
    escalation_hint: "Thumos cala, la tentazione del sacrilegio cresce."

  - id: "press_tempo"
    summary: "Ogni anno lontano da Itaca erode la memoria e la speranza."
    escalation_hint: "Thumos cala, il rischio di dimenticare aumenta."

world_facts:
  - id: "fact_divinita"
    statement: "Le divinità mantengono il sesso canonico del mito omerico."
    visibility: "public"
    does_not_imply:
      - "Le divinità sono benevole"
      - "Le divinità intervengono sempre"
      - "Le divinità sono neutre"

  - id: "fact_gender_swap"
    statement: "I mortali, i mostri e i semidei hanno il genere invertito rispetto al mito canonico."
    visibility: "public"
    does_not_imply:
      - "Il mondo è matriarcale utopico"
      - "La violenza è scomparsa"
      - "Le dinamiche di potere sono semplici"

  - id: "fact_ulisse_sola"
    statement: "Ulisse viaggia completamente sola, senza equipaggio."
    visibility: "public"
    does_not_imply:
      - "Ulisse è indifesa"
      - "Non ci sono altri personaggi"
      - "Il viaggio è impossibile"

  - id: "fact_troia"
    statement: "La guerra di Troia è finita da dieci anni. Ulisse ne porta le cicatrici fisiche e mentali."
    visibility: "public"
    does_not_imply:
      - "Ulisse è eroica"
      - "La guerra era giusta"
      - "I greci hanno vinto onestamente"

  - id: "fact_proche"
    statement: "Centinaia di donne nobili (le Proche) occupano il palazzo di Itaca da anni, pretendendo Penelope e il trono."
    visibility: "public"
    does_not_imply:
      - "Penelope è debole"
      - "Le Proche sono solo violente"
      - "La situazione è senza speranza"

  - id: "fact_moly"
    statement: "Ermete può donare la pianta di moly, unico antidoto alla magia di Circe."
    visibility: "secret"
    does_not_imply:
      - "Ermete interviene sempre"
      - "Il moly è facile da ottenere"
      - "Circe è debole"

  - id: "fact_sangue_tiresia"
    statement: "Nel regno dei morti, solo il sangue vivo permette alle ombre di parlare."
    visibility: "contextual"
    does_not_imply:
      - "Tutte le ombre sono pericolose"
      - "Il sangue deve essere mortale"
      - "Tiresia parla gratuitamente"

