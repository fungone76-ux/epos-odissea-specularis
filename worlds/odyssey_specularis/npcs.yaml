      - "La solitudine eterna"
    goals:
      - "Trovare un compagno che non fugga"
      - "Sacrificare i prigionieri a Poseidone"
    secrets:
      - "Il suo occhio unico ha una membrana che si chiude solo nel sonno profondo"
      - "Ha paura del buio totale"
    knowledge:
      - "I ciclope sono figli di Poseidone"
      - "Gli uomini mentono sempre"
      - "Il latte di pecora guarisce le ferite"
    skills:
      sarissa: 5
      dolos: 0
      eros: 0
      thumos: 1
      pontos: 0
