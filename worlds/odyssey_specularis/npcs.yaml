    red_lines:
      - "Non permette a nessuno di toccare le sue pecore"
      - "Non accetta ordini da nessuno"
      - "Non perdona l'inganno"
    intimate_profile: >
      Usa i prigionieri maschi per piacere prima di mangiarli. Il corpo
