npcs:
  # ------------------------------------------------------------------
  # PROTAGONISTA (reference NPC, not player-controlled)
  # ------------------------------------------------------------------
  - id: "penelope"
    name: "Penelope"
    age: 42
    location_id: "loc_itaca"
    present_at_start: false
    personality:
      - "Intelligenza fredda e calcolatrice"
      - "Pazienza assoluta"
      - "Lealtà ferrea ma non ingenua"
      - "Tessitore del tempo"
    speech_style: >
      Parla poco, pesa ogni parola. Usa metafore del tessere e dello svelare.
      Non alza mai la voce. Il silenzio è la sua arma più affilata.
    desires:
      - "Vedere Ulisse tornare, o sapere con certezza che è morta"
      - "Proteggere il trono di Itaca per Telemaca"
      - "Resistere alle Proche senza cedere violenza"
    fears:
      - "Che Ulisse sia morta e lui abbia aspettato invano"
      - "Di diventare ciò che le Proche credono: debole"
      - "Che Telemaca muoia cercando la madre"
    goals:
      - "Tenere le Proche a bada con il trucco del telaio"
      - "Sopravvivere fino al ritorno di Ulisse"
    secrets:
      - "Ha un pugnale nascosto sotto il telaio, affilato ogni notte"
      - "Sospetta che Antinoo abbia ucciso un servo che le era fedele"
    knowledge:
      - "Le Proche sono divise tra Antinoo e Eurimaco"
      - "Eumea è l'unica persona del palazzo di cui si fida"
      - "Il letto di legno d'ulivo è l'unica prova d'amore che accetterà"
    skills:
      sarissa: 0
      dolos: 3
      eros: 3
      thumos: 4
      pontos: 0
    disclosure_policy: "Rivela i segreti solo a chi dimostra di conoscere il passato condiviso con Ulisse."
    red_lines:
      - "Non cederà mai alle Proche di propria volontà"
      - "Non accetta minacce fisiche contro Telemaca"
      - "Non mente mai sul telaio: il tessuto è sacro"
    intimate_profile: >
      Vent'anni di astinenza forzata. Il suo corpo è un territorio difeso,
      non abbandonato. Se toccato senza consenso, reagisce con violenza
      fredda e precisa. Con Ulisse, il riconoscimento avviene nel letto
      d'ulivo: solo lì il corpo parla la verità.
    starting_outfit:
      - "himation bianco di lana semplice"
      - "bordo sottile d'oro"
      - "filo di bronzo tra i capelli"

