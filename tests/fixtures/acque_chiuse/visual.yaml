# ============================================================================
# ACQUE CHIUSE — character sheet visive CANONICHE
#
# I base_prompt e i LoRA di identità sono copiati esattamente dalle sheet
# canoniche del progetto originale (content/visual/*.yaml), mai alterati
# a runtime. Rook e Lienne sono personaggi nuovi: nessun LoRA di identità
# esiste per loro, il prompt resta descrittivo (stesso stile Pony).
#
# LoRA canonici (vecchio repo, verificati):
#   Luna  (player) : stsDebbie-10e:0.7            trigger: stsdebbie
#   Maria (marea)  : stsSmith-10e:0.65            trigger: stsSmith
#   Stella (ilsa)  : alice_milf_catchers_lora:0.7 trigger: alice_milf_catchers
#   Vaela (vel)    : vaela_orm_identity:0.7       trigger: vaela_orm
#
# LoRA GLOBALI canonici (renderer del vecchio repo, canonical_global,
# obbligatori su OGNI render, qualunque sia il cast):
#   Expressive_H-000001:0.35   (espressività, senza alterare il volto)
#   FantasyWorldPonyV2:0.40    (atmosfera/materiali fantasy)
# Sono nel prompt_suffix_en del pack: aggiunti UNA volta in coda, non per
# personaggio. Per questo i base prompt di marea/vel NON ripetono
# FantasyWorldPonyV2 in linea: nel vecchio renderer era sia inline sia
# globale, qui vale una sola applicazione al peso canonico 0.40.
#
# Parametri di generazione canonici (riferimento per il workflow ComfyUI):
#   steps 24 · 832x1216 · CFG 3.2 · sampler DPM++ 2M Karras · seed -1
#   face restoration: CodeFormer
# ============================================================================

# Regola di stile del mondo (adult game): vale per ogni personaggio che non
# dichiara una style_en propria. Viene copiata nel prompt positivo dopo il
# base prompt e guida anche le scelte di outfit del Game Master.
visual_style_en: >
  sexy revealing outfit, skimpy and form-fitting clothing, showing cleavage,
  bare shoulders, bare midriff or bare thighs, clingy wet fabric when wet,
  seductive but elegant

negative_extra_en: "modest clothing, baggy clothes, fully covered body"

# LoRA globali canonici: una sola applicazione, in coda al prompt positivo.
prompt_suffix_en: "<lora:Expressive_H-000001:0.35>, <lora:FantasyWorldPonyV2:0.40>"

characters:
  - id: player
    # COPIA ESATTA del fixed_base_prompt canonico di Luna + LoRA identità
    # canonico stsDebbie-10e:0.7 (nel vecchio yaml era in lora_refs separato;
    # qui inline come già fanno maria/stella/vaela nelle loro sheet).
    base_prompt: >
      score_9, score_8_up, masterpiece, photorealistic, detailed,
      atmospheric, stsdebbie, dynamic pose, 1girl, mature woman, brown hair,
      shiny skin, head tilt, massive breasts, cleavage,
      <lora:stsDebbie-10e:0.7>
