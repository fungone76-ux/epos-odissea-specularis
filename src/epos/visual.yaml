# ============================================================
# ODYSSEY SPECULARIS — Visual Sheets
# Character sheets for image generation.
# Base prompts immutabili, copiati esatti dai LoRA canonici.
# ============================================================

# Regola di stile del mondo (Bronze Age greco, adulto)
# Solo tag concreti e disegnabili: niente date ("circa 1200 BCE" = rumore),
# niente "or", niente concetti gia' coperti dalle sheet dei personaggi.
visual_style_en: >
  ancient Greek Bronze Age, Mycenaean era, Mediterranean light,
  wool and linen textiles, bronze jewelry and weapons,
  volcanic stone and marble architecture, Aegean sea atmosphere,
  mythological realism, cinematic composition, film grain, dramatic shadows

negative_extra_en: >
  modern clothes, futuristic elements, cartoon, anime, bright saturated colors,
  clean cheerful faces, soft lighting, bokeh, portrait lens,
  city background, elf ears, excessive jewelry, cyberpunk,
  steampunk, neon, plastic, glass, asphalt, cars, electricity

# LoRA globali canonici (copiati da Acque Chiuse)
prompt_suffix_en: "<lora:Expressive_H-000001:0.35>, <lora:FantasyWorldPonyV2:0.40>"

visual_policy:
  protected_base_prompts: true
  single_character_default: true
  multi_character_mode: "intimate_only"
  speaker_action_focus: true
  include_sheet_negative: true
  sanitize_identity_layers: true
  concise_role_prompts: true
  max_role_prompt_words: 12
  avoid_facial_expressions: true
  visual_en_primary: true
  dedupe_across_layers: true
  max_scene_tags: 6
  role_prompt_optional: true
  preserve_revealing_outfit_traits: true
  revealing_outfit_priority: true
  visual_director_enabled: true
  structured_camera: true
  camera_variety_enabled: true
  camera_history_size: 6
  crawling_preferred_views:
    - rear_three_quarter
    - rear
    - side
    - front_three_quarter
  avoid_repeating_camera: true
  # Tag di posa esplicita iniettati dal regista quando la scena dichiara
  # una posa esibizionistica (hanno priorita' sulla varieta' di camera).
  explicit_pose_tags_rear:
    - ass focus
    - bent over
    - presenting
    - spread legs
    - hips raised
    - from behind
  explicit_pose_tags_front:
    - presenting
    - spread legs
    - legs apart
    - offering herself
    - on display

